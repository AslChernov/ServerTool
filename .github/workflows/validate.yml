name: Validate ServerTool

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Bash syntax
        run: |
          bash -n server_tool.sh
          bash -c 'source ./server_tool.sh; write_guard_updater /tmp/server-tool-guard-update'
          bash -n /tmp/server-tool-guard-update
          for test in tests/*.sh; do bash -n "$test"; done
      - name: Run ShellCheck
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables shellcheck
          set +e
          shellcheck --severity=warning --format=json1 \
            server_tool.sh \
            /tmp/server-tool-guard-update \
            tests/guard_ports_test.sh > /tmp/shellcheck.json
          status=$?
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/shellcheck.json").read_text() or "{}")
          items = payload.get("comments", []) if isinstance(payload, dict) else payload
          for item in items:
              level = "error" if item["level"] == "error" else "warning"
              title = f"SC{item['code']}"
              message = item["message"].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(
                  f"::{level} file={item['file']},line={item['line']},col={item['column']},"
                  f"endLine={item['endLine']},endColumn={item['endColumn']},title={title}::{message}"
              )
          PY
          exit "$status"
      - name: Test custom ports, CrowdSec and APT recovery
        run: |
          bash tests/guard_ports_test.sh
          bash tests/crowdsec_lapi_test.sh
          bash tests/run_apt_test.sh
      - name: Smoke-test OS detection and status
        run: sudo bash server_tool.sh --status
      - name: Smoke-test SSH runtime directory recovery
        run: |
          runtime_dir=$(mktemp -d)
          rmdir "$runtime_dir"
          sudo bash -c 'source server_tool.sh; ensure_sshd_runtime_dir "$1"' _ "$runtime_dir"
          test "$(stat -c '%U:%G:%a' "$runtime_dir")" = "root:root:755"
      - name: Validate generated nftables rules
        run: |
          sudo install -d -m 700 /etc/server-tool /var/lib/server-tool
          sudo install -m 755 /tmp/server-tool-guard-update /usr/local/sbin/server-tool-guard-update
          sudo touch /var/lib/server-tool/blocklist-v4.txt
          sudo tee /etc/server-tool/guard.conf >/dev/null <<'EOF'
          SSH_PORT="35425"
          NODE_PORT="2222"
          PANEL_IPV4="45.148.62.18"
          HTTPS_MODE="both"
          EXTRA_TCP_PORTS="8443 9443"
          EXTRA_UDP_PORTS="5353"
          BLOCKLIST_URLS=()
          GEO_COUNTRIES=""
          EOF
          set +e
          output=$(sudo /usr/local/sbin/server-tool-guard-update --check 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if ((status != 0)); then
            message=${output//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            echo "::error file=server_tool.sh,title=nftables validation::${message}"
          fi
          exit "$status"
