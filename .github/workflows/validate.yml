name: Validate ServerTool

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Bash syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("server_tool.sh").read_text()
          for marker, target in (
              ("GUARD_SCRIPT", "/tmp/server-tool-guard-update"),
              ("CROWDSEC_FORWARD_SCRIPT", "/tmp/server-tool-crowdsec-forward"),
          ):
              start = source.index(f"<<'{marker}'")
              start = source.index("\n", start) + 1
              end = source.index(f"\n{marker}\n", start)
              Path(target).write_text(source[start:end] + "\n")
          PY
          bash -n server_tool.sh
          bash -n /tmp/server-tool-guard-update
          bash -n /tmp/server-tool-crowdsec-forward
      - name: Run ShellCheck
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables shellcheck
          set +e
          shellcheck --severity=warning --format=json1 \
            server_tool.sh \
            /tmp/server-tool-guard-update \
            /tmp/server-tool-crowdsec-forward > /tmp/shellcheck.json
          status=$?
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/shellcheck.json").read_text() or "{}")
          items = payload.get("comments", []) if isinstance(payload, dict) else payload
          for item in items:
              level = "error" if item["level"] == "error" else "warning"
              title = f"SC{item['code']}"
              message = item["message"].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(
                  f"::{level} file={item['file']},line={item['line']},col={item['column']},"
                  f"endLine={item['endLine']},endColumn={item['endColumn']},title={title}::{message}"
              )
          PY
          exit "$status"
      - name: Validate generated nftables rules
        run: |
          sudo install -d -m 700 /etc/server-tool /var/lib/server-tool
          sudo install -m 755 /tmp/server-tool-guard-update /usr/local/sbin/server-tool-guard-update
          sudo touch /var/lib/server-tool/blocklist-v4.txt
          sudo tee /etc/server-tool/guard.conf >/dev/null <<'EOF'
          SSH_PORT="35425"
          NODE_PORT="2222"
          PANEL_IPV4="45.148.62.18"
          HTTPS_MODE="both"
          BLOCKLIST_URLS=()
          GEO_COUNTRIES=""
          EOF
          sudo /usr/local/sbin/server-tool-guard-update --check
